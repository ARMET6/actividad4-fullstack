<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actividad 4 - Adrian</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; padding-top: 20px; }
        .card { border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-center mb-4">Panel Full Stack - Tecmilenio</h2>
        <div class="row">
            <div class="col-md-4">
                <div class="card p-4">
                    <h4>Acceso</h4>
                    <input type="text" id="username" class="form-control mb-2" placeholder="Usuario">
                    <input type="password" id="password" class="form-control mb-3" placeholder="Contraseña">
                    <button type="button" class="btn btn-primary w-100 mb-2" onclick="console.log('Clic en Registrar'); registrar();">Registrar</button>
                    <button type="button" class="btn btn-success w-100" onclick="console.log('Clic en Login'); login();">Login</button>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card p-4">
                    <h4>Productos en MongoDB</h4>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Precio</th>
                                <th>Stock</th>
                            </tr>
                        </thead>
                        <tbody id="lista-productos">
                            <tr><td colspan="3" class="text-center">Inicia sesión para ver datos</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Usamos rutas relativas para que funcione tanto en local como en Vercel
        const API_URL = '/api';
        let token = '';

        async function registrar() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                alert(response.ok ? "Usuario creado" : "Error: " + data.message);
            } catch (err) {
                alert("Error de conexión");
            }
        }

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();

                if (response.ok) {
                    token = data.token;
                    alert("Login exitoso");
                    cargarProductos();
                } else {
                    alert("Error: " + data.message);
                }
            } catch (err) {
                alert("Error en la petición");
            }
        }

        async function cargarProductos() {
            try {
                const response = await fetch(`${API_URL}/products`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const productos = await response.json();
                const lista = document.getElementById('lista-productos');
                
                lista.innerHTML = productos.map(p => `
                    <tr>
                        <td>${p.nombre || p.name}</td>
                        <td>$${p.precio || p.price}</td>
                        <td>${p.stock}</td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error("Error al cargar productos", err);
            }
        }
    </script>
</body>
</html>
